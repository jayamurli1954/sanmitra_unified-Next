# SanMitra ops monitor — product + backend registry
#
# Daily email folds FE/BE health, deep /health checks, latency, SSL warn,
# optional Vercel/Sentry, and VERSION drift into one report.
#
# Production backend: set PRODUCTION_BACKEND_HEALTH_URL in GitHub secrets/vars
# when a separate prod Render URL exists. Leave blank to skip that row.
#
# vercel_project_id: optional. Project Settings → General on Vercel.
# Requires VERCEL_TOKEN GitHub secret.

thresholds:
  fe_latency_ms_warn: 500
  be_latency_ms_warn: 2000
  ssl_warn_days: 21

backends:
  - name: Staging API
    env: staging
    health_url: https://sanmitra-unified-next-staging-sg.onrender.com/health
  - name: Production API
    env: production
    # Overridden at runtime by PRODUCTION_BACKEND_HEALTH_URL when set.
    health_url: ""

products:
  - name: MitraBooks
    frontend_url: https://www.mitrabooks.sanmitratech.in
    # Shared unified backend (staging until prod URL is configured).
    backend_env: staging
    vercel_project_id: ""

  - name: LegalMitra
    frontend_url: https://www.legalmitra.sanmitratech.in
    backend_env: staging
    vercel_project_id: ""

  - name: GruhaMitra
    frontend_url: https://www.gruhamitra.sanmitratech.in
    backend_env: staging
    vercel_project_id: ""

  - name: MandirMitra
    frontend_url: https://www.mandirmitra.sanmitratech.in
    backend_env: staging
    vercel_project_id: ""
