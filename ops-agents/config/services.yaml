# SanMitra ops monitor — product + backend registry
#
# Daily email folds FE/BE health, deep /health checks, latency, SSL warn,
# optional Vercel/Sentry, and VERSION drift into one report.
#
# Live traffic: all *.sanmitratech.in frontends proxy API to live_backend_health_url
# until a separate Render production service exists. Override with GitHub secret
# PRODUCTION_BACKEND_HEALTH_URL when prod diverges from staging host.
#
# vercel_project_id: optional. Project Settings → General on Vercel.
# Requires VERCEL_TOKEN GitHub secret.

thresholds:
  fe_latency_ms_warn: 500
  be_latency_ms_warn: 2000
  ssl_warn_days: 21

# Canonical API /health for production user traffic (Vercel → Render rewrite).
live_backend_health_url: https://sanmitra-unified-next-staging-sg.onrender.com/health

backends:
  - name: Staging API
    env: staging
    health_url: https://sanmitra-unified-next-staging-sg.onrender.com/health
  - name: Live API (prod traffic)
    env: production
    # Default from live_backend_health_url; secret PRODUCTION_BACKEND_HEALTH_URL overrides.
    health_url: https://sanmitra-unified-next-staging-sg.onrender.com/health

products:
  - name: MitraBooks
    frontend_url: https://www.mitrabooks.sanmitratech.in
    backend_env: staging
    vercel_project_id: ""

  - name: LegalMitra
    frontend_url: https://www.legalmitra.sanmitratech.in
    backend_env: staging
    vercel_project_id: ""

  - name: GruhaMitra
    frontend_url: https://www.gruhamitra.sanmitratech.in
    backend_env: staging
    vercel_project_id: ""

  - name: MandirMitra
    frontend_url: https://www.mandirmitra.sanmitratech.in
    backend_env: staging
    vercel_project_id: ""
